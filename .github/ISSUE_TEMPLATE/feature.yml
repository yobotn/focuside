name: Feature request
description: Suggest an idea or a change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or slow today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should FocusIDE do?
  - type: textarea
    id: other
    attributes:
      label: Other ways you tried
