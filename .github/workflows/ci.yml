name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Text lint (files)
        run: node scripts/text-lint.mjs

      - name: Text lint (commit messages)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          git log --format=%B "$base..HEAD" > commit-msgs.txt || git log -1 --format=%B > commit-msgs.txt
          node scripts/text-lint.mjs --commit-msg commit-msgs.txt

      - name: Install UI dependencies
        run: npm --prefix apps/desktop install --no-audit --no-fund

      - name: File icons
        run: node scripts/build-icons.mjs

      - name: Build UI
        run: npm --prefix apps/desktop run build

      - name: UI type check
        run: npm --prefix apps/desktop run check

      - name: Strings
        run: node scripts/i18n-check.mjs

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
