name: Release

# Push a tag like v0.1.0 to build the Windows installer, sign the update files and create a
# draft GitHub Release with latest.json for the in-app updater. Publish the draft by hand
# after a check; the updater only sees published releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: npm --prefix apps/desktop install --no-audit --no-fund

      - name: File icons
        run: node scripts/build-icons.mjs

      # FocusIDE does not bundle claude-agent-acp: the app downloads it on first use. Remove
      # copies a cached target folder may still hold from older builds, then check the config.
      - name: Bundle check (config)
        shell: bash
        run: |
          rm -f target/release/claude-agent-acp* target/release/claude target/release/claude.exe
          node scripts/check-bundle.mjs

      - name: Build, sign updates and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: FocusIDE ${{ github.ref_name }}
          releaseBody: |
            Windows installer: download `FocusIDE_*_x64-setup.exe` below.

            The installer is not code-signed yet, so Windows SmartScreen may warn. Choose "More info", then "Run anyway".

            FocusIDE starts the coding agent you installed yourself (Claude Code, Codex, Gemini CLI and other ACP agents). It never reads, stores or proxies your credentials.

            Claude with a plan login (Pro, Max, Team or Enterprise) opens in a Claude pane. The pane is the real `claude` CLI with its own login, and you type every prompt in it. FocusIDE shows the changes of each turn and can undo them.

            Claude chat mode needs an API key (`ANTHROPIC_API_KEY`) or a cloud provider (Bedrock, Vertex AI or Foundry).

            Chat mode downloads the claude-agent-acp connector from its GitHub release (agentclientprotocol/claude-agent-acp) the first time you use it, after you agree.

            Claude panes can use an observe-only plugin that reports when a turn starts and ends. FocusIDE asks before it adds the plugin, and you can turn it off in Settings.

            New agents: Antigravity CLI, Copilot CLI, Cursor CLI, Kiro CLI, Cline, Kimi Code and Mistral Vibe. Install them yourself; FocusIDE does not install agents. Antigravity CLI opens in a pane, and FocusIDE asks once before chat mode.

            Found a problem? [Open an issue](https://github.com/yobotn/focuside/issues/new/choose).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Bundle check (build output)
        run: node scripts/check-bundle.mjs target/release
