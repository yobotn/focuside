[package]
name = "focuside-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FocusIDE core: agents over ACP, process trees, shadow snapshots, plan parser, files"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
# Adapter download on first use (adapter_download.rs). Same crates and TLS setup as tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
